<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#3a3a3a;height:100%}
  body{display:flex;align-items:flex-start;justify-content:center;padding:12px}
  iframe{width:390px;height:844px;border:0;background:#fff;box-shadow:0 0 0 1px #000}
</style></head>
<body>
<iframe id="f" src="about:blank"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var page = q.get('page') || 'index.html';
  var shot = q.get('shot') || 'top';
  var off  = q.get('off')  || '0';
  var w    = q.get('w');
  var h    = q.get('h');
  var f = document.getElementById('f');
  if (w) f.style.width = w + 'px';
  if (h) f.style.height = h + 'px';
  var lang = q.get("lang");
  var sheet = q.get("sheet");
  f.src = '/' + page + '?shot=' + encodeURIComponent(shot) + '&off=' + off +
          (lang ? "&lang=" + encodeURIComponent(lang) : "") +
          (sheet ? "&sheet=1" : "");
</script>
</body></html>
